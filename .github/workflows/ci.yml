name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: C++ build + GoogleTests (sphere + solver)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build python3-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -GNinja -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run sphere + solver tests
        run: ctest --test-dir build --output-on-failure -R "sphere_tests|solver_tests"

  python-validate:
    name: nanobind modules + ruff + cross-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build python3-dev python3-pip

      - name: Install Python dependencies
        run: pip3 install nanobind numpy scipy ruff --break-system-packages

      - name: Configure (with Python)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -GNinja

      - name: Build nanobind modules
        run: cmake --build build --parallel --target sphere_fitter_py solver_py

      - name: ruff lint
        run: ruff check python/ solver/python/ solver/scripts/

      - name: Sphere fitter cross-validation
        run: python3 python/validate.py

      - name: Solver RK4 cross-validation
        run: python3 solver/python/solver_validate.py

  radar-perception-test:
    name: Radar pipeline — 15 GoogleTests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y cmake ninja-build

      - name: Configure
        run: cmake -S radar_perception_pipeline -B build-radar -DCMAKE_BUILD_TYPE=Release -GNinja

      - name: Build
        run: cmake --build build-radar --parallel

      - name: Run 15 GoogleTests
        run: ctest --test-dir build-radar --output-on-failure -V

  python-engine-test:
    name: PythonEngine (embedded CPython) — 9 GoogleTests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build python3-dev python3-pip

      - name: Install Python dependencies
        run: pip3 install nanobind numpy --break-system-packages

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -GNinja

      - name: Build python_engine_tests
        run: cmake --build build --parallel --target python_engine_tests

      - name: Run PythonEngine tests
        run: ctest --test-dir build --output-on-failure -R "python_engine_tests"
