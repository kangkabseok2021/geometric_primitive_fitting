name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: C++ build + 10 GoogleTests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -GNinja -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  python-validate:
    name: pybind11 build + ruff + SciPy cross-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build python3-dev python3-pip

      - name: Install Python dependencies
        run: pip3 install numpy scipy ruff --break-system-packages

      - name: Configure (with Python)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -GNinja

      - name: Build pybind11 module
        run: cmake --build build --parallel --target sphere_fitter_py

      - name: ruff lint
        run: ruff check python/

      - name: SciPy cross-validation
        run: python3 python/validate.py
